name: Deploy

# Deploys the production stage on every push to main. Until the one-time AWS
# bootstrap is done (see infra/README.md) the repository variable AWS_ROLE_ARN
# is not set and the whole job is skipped, so pushes do not fail.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; never cancel one that is already running (SST holds a
# state lock and a cancelled run would leave it behind).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # needed to request the OIDC token

jobs:
  deploy:
    # Skipped (not failed) while AWS_ROLE_ARN is unset.
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    env:
      SST_TELEMETRY_DISABLED: '1'
      PORTFOLIO_AWS_REGION: ${{ vars.PORTFOLIO_AWS_REGION || 'eu-west-1' }}
      # Optional, see infra/config.ts. Unset = CloudFront default domain.
      PORTFOLIO_DOMAIN: ${{ vars.PORTFOLIO_DOMAIN }}
      PORTFOLIO_DOMAIN_REDIRECTS: ${{ vars.PORTFOLIO_DOMAIN_REDIRECTS }}
      PORTFOLIO_CERT_ARN: ${{ vars.PORTFOLIO_CERT_ARN }}
      PORTFOLIO_BUDGET_LIMIT_USD: ${{ vars.PORTFOLIO_BUDGET_LIMIT_USD }}
      PORTFOLIO_BUDGET_EMAIL: ${{ secrets.PORTFOLIO_BUDGET_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same gates as ci.yml: a push that breaks them is never deployed.
      - run: pnpm check
      - run: pnpm test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.PORTFOLIO_AWS_REGION }}

      # SST runs `pnpm build` itself (see infra/site.ts) and uploads dist/.
      - run: pnpm exec sst deploy --stage production
