AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time bootstrap for the portfolio: lets GitHub Actions assume an IAM role
  through OIDC (no long-lived keys) to run `sst deploy --stage production`.
  It cannot be created by the pipeline itself, so the author deploys this stack
  once with local credentials. Re-deploy it only when the policy below changes
  (for example when S09 adds Lambda and DynamoDB).

Parameters:
  GitHubRepo:
    Type: String
    Default: gmerinojimenez/portfolio
    Description: owner/repo allowed to assume the role.
  GitHubBranch:
    Type: String
    Default: main
    Description: Only this branch can assume the role.
  DeployRegion:
    Type: String
    Default: eu-west-1
    Description: Region SST deploys to (must match PORTFOLIO_AWS_REGION).
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: >
      ARN of the account's existing GitHub OIDC provider. Leave empty to create
      it (an account can have only one provider per URL).

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, '']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portfolio-github-deploy
      Description: Assumed by GitHub Actions to deploy the portfolio with SST.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: portfolio-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SstStateAndAssetBuckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::sst-state-*
                  - arn:aws:s3:::sst-state-*/*
                  - arn:aws:s3:::sst-asset-*
                  - arn:aws:s3:::sst-asset-*/*
              - Sid: PortfolioBuckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::portfolio-*
                  - arn:aws:s3:::portfolio-*/*
              - Sid: ListBuckets
                Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: '*'
              - Sid: SstParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                  - ssm:ListTagsForResource
                Resource: !Sub arn:aws:ssm:${DeployRegion}:${AWS::AccountId}:parameter/sst/*
              - Sid: DescribeSsm
                Effect: Allow
                Action: ssm:DescribeParameters
                Resource: '*'
              # CloudFront resources have no predictable ARN before creation, so
              # this one cannot be narrowed by name.
              - Sid: CloudFront
                Effect: Allow
                Action:
                  - cloudfront:*
                  - cloudfront-keyvaluestore:*
                Resource: '*'
              # Only needed once a custom domain is set. CloudFront requires the
              # certificate to live in us-east-1.
              - Sid: CertificatesInUsEast1
                Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:DeleteCertificate
                  - acm:ListCertificates
                  - acm:ListTagsForCertificate
                  - acm:AddTagsToCertificate
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
              - Sid: Route53ForCustomDomain
                Effect: Allow
                Action:
                  - route53:ListHostedZones
                  - route53:ListHostedZonesByName
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
                  - route53:ListTagsForResource
                Resource: '*'
              - Sid: PortfolioBudgets
                Effect: Allow
                Action: budgets:*
                Resource: !Sub arn:aws:budgets::${AWS::AccountId}:budget/portfolio-*
              - Sid: ViewBudgets
                Effect: Allow
                Action: budgets:ViewBudget
                Resource: '*'

Outputs:
  RoleArn:
    Description: Value for the AWS_ROLE_ARN repository variable in GitHub.
    Value: !GetAtt DeployRole.Arn
